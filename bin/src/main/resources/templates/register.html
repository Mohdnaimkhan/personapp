<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Register</title>
    <style>
        body { margin: 0; min-height:100vh; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: radial-gradient(circle at top, rgba(79,70,229,0.16), transparent 30%), linear-gradient(180deg, #eef2ff 0%, #f8fbff 100%); color:#0f172a; display:flex; align-items:center; justify-content:center; }
        .form-box { width:min(100%,520px); margin:32px; padding:38px 38px 32px; background:white; border-radius:30px; box-shadow:0 34px 80px rgba(15,23,42,0.14); border:1px solid rgba(15,23,42,0.08); }
        h1 { margin:0 0 10px; font-size:2.5rem; line-height:1.05; }
        .subtitle { margin:0 0 28px; color:#475569; line-height:1.75; }
        label { display:block; margin-top:18px; font-weight:600; color:#334155; }
        input { width:100%; padding:14px 16px; margin-top:8px; border:1px solid rgba(15,23,42,0.14); border-radius:14px; background:#f8fafc; font-size:1rem; color:#0f172a; }
        input:focus { outline:none; border-color:#2563eb; box-shadow:0 0 0 4px rgba(37,99,235,0.12); }
        button { width:100%; margin-top:28px; padding:14px 18px; border:none; border-radius:999px; background:linear-gradient(135deg,#2563eb,#0ea5e9); color:white; font-weight:700; font-size:1rem; cursor:pointer; box-shadow:0 20px 34px rgba(37,99,235,0.22); }
        .field-error { color:#dc2626; margin-top:10px; font-size:.95rem; }
        .info { margin-top:20px; color:#475569; font-size:.95rem; }
        .info a { color:#2563eb; text-decoration:none; font-weight:600; }
    </style>
</head>
<body>
<div class="form-box">
    <h1>Create your account</h1>
    <p class="subtitle">Get started with Person App and keep your contacts organized in one polished place.</p>
    <form th:action="@{/register}" th:object="${appUser}" method="post">
        <label for="username">Username</label>
        <input id="username" type="text" th:field="*{username}" />
        <div class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>

        <label for="email">Email</label>
        <input id="email" type="email" th:field="*{email}" />
        <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>

        <label for="password">Password</label>
        <input id="password" type="password" th:field="*{password}" />
        <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>

        <button type="submit">Register</button>
    </form>
    <div class="info">Already registered? <a th:href="@{/login}">Sign in</a></div>
</div>
</body>
</html>
