<!DOCTYPE html>
<div th:fragment="nav">
    <style>
        .top-nav { display:flex; justify-content:space-between; align-items:center; gap:14px; padding:18px clamp(24px,4vw,36px); background:rgba(255,255,255,0.88); backdrop-filter:blur(18px); box-shadow:0 28px 50px rgba(15,23,42,0.12); border-radius:0 0 26px 26px; color:#0f172a; }
        .top-nav .logo { font-weight:800; font-size:1.38rem; letter-spacing:.04em; color:#1d4ed8; }
        .top-nav .nav-links { display:flex; flex-wrap:wrap; gap:12px; align-items:center; }
        .nav-btn { display:inline-flex; align-items:center; justify-content:center; min-height:44px; padding:0 18px; border-radius:999px; background:#ffffff; color:#0f172a; text-decoration:none; font-weight:600; border:1px solid rgba(15,23,42,0.08); transition:transform .18s ease, background .18s ease, box-shadow .18s ease; }
        .nav-btn:hover { transform:translateY(-2px); background:#eff6ff; box-shadow:0 16px 32px rgba(15,23,42,0.1); }
        .nav-cta { display:inline-flex; align-items:center; justify-content:center; min-height:44px; padding:0 20px; border-radius:999px; background:linear-gradient(135deg,#2563eb,#0ea5e9); color:white; font-weight:700; box-shadow:0 18px 42px rgba(14,165,233,0.22); }
        .nav-cta:hover { transform:translateY(-2px); }
        .user-area { display:flex; align-items:center; gap:10px; font-size:.96rem; color:#334155; }
        .user-area a { color:#0f172a; text-decoration:underline; }
        @media (max-width:860px) { .top-nav { flex-direction:column; align-items:flex-start; gap:16px; } }
    </style>
    <nav class="top-nav" role="navigation">
        <div class="logo">Person App</div>
        <div class="nav-links">
            <a class="nav-btn" th:href="@{/dashboard}">Dashboard</a>
            <a class="nav-btn" th:href="@{/persons}">Persons</a>
            <a class="nav-btn" th:href="@{/about}">About Us</a>
            <a class="nav-cta" th:href="@{/persons/new}">+ Add Person</a>
            <div class="user-area" th:if="${username}">Hello, <strong th:text="${username}"></strong> • <a th:href="@{/logout}">Logout</a></div>
        </div>
    </nav>
</div>
