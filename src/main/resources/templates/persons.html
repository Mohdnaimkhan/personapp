<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <title>Person Directory</title>
    <style>
        body {
            margin: 0;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f4f8ff;
            color: #102a43;
        }

        .page-shell {
            padding: 28px clamp(24px, 4vw, 48px);
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 18px;
            margin: 26px 0 18px;
        }

        .toolbar h1 {
            margin: 0;
            font-size: clamp(2rem, 2.4vw, 2.4rem);
            letter-spacing: -0.03em;
        }

        .toolbar .action-link {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 18px;
            border-radius: 12px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            font-weight: 700;
            box-shadow: 0 20px 38px rgba(37, 99, 235, 0.16);
        }

        .error {
            color: #dc2626;
            margin: 0 0 18px;
            font-weight: 600;
        }

        .table-card {
            overflow: hidden;
            border-radius: 12px;
            border: 1px solid rgba(15, 23, 42, 0.08);
            background: white;
            box-shadow: 0 24px 60px rgba(15, 23, 42, 0.06);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 18px 16px;
            border-bottom: 1px solid rgba(15, 23, 42, 0.08);
        }

        th {
            background: #4592f6;
            color: #0f3181;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .03em;
            font-size: .85rem;
        }

        tr:hover {
            background: #f8fbff;
        }

        tr:last-child td {
            border-bottom: 1px solid rgba(15, 23, 42, 0.08);
        }

        tbody tr:nth-child(even) {
            background: #d4d4ee;
        }

        a.button,
        button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            padding: 12px 18px;
            border-radius: 12px;
            background: #2563eb;
            color: white;
            border: none;
            text-decoration: none;
            font-weight: 700;
            cursor: pointer;
            transition: transform .18s ease;
        }

        a.button:hover,
        button:hover {
            transform: translateY(-2px);
        }

        .action-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        a.person-action {
            color: #2563eb;
            font-weight: 700;
            text-decoration: none;
        }

        button.danger-button {
            padding: 10px 14px;
            border: none;
            border-radius: 12px;
            background: #ef4444;
            color: white;
            cursor: pointer;
            transition: transform .18s ease;
        }

        button.danger-button:hover {
            transform: translateY(-2px);
        }

        form.inline {
            display: inline-block;
        }
    </style>
</head>

<body>
    <div th:replace="~{fragments/nav :: nav}"></div>
    <main class="page-shell">
        <div class="toolbar">
            <h1>Person Directory</h1>
            <a class="action-link" th:href="@{/persons/new}">+ Add Person</a>
        </div>
        <div th:if="${errorMessage}" class="error" th:text="${errorMessage}"></div>
        <div class="table-card">
            <table>
                <thead>
                    <tr>

                        <th>First Name</th>
                        <th>Last Name</th>
                        <th>Email</th>
                        <th>Age</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="person : ${persons}">

                        <td th:text="${person.firstName}"></td>
                        <td th:text="${person.lastName}"></td>
                        <td th:text="${person.email}"></td>
                        <td th:text="${person.age}"></td>
                        <td>
                            <div class="action-group">
                                <a class="person-action" th:href="@{/persons/edit/{id}(id=${person.id})}">Edit</a>
                                <form class="inline" th:action="@{/persons/delete/{id}(id=${person.id})}" method="post">
                                    <button class="danger-button" type="submit">Delete</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>

</html>
