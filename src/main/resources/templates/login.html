<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <title>Login</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: radial-gradient(circle at top, rgba(59, 130, 246, 0.22), transparent 28%), linear-gradient(180deg, #eff6ff 0%, #f8fbff 100%);
            color: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-box {
            width: min(100%, 460px);
            margin: 32px;
            padding: 36px 36px 30px 36px;
            background: white;
            border-radius: 28px;
            box-shadow: 0 32px 70px rgba(15, 23, 42, 0.12);
            border: 1px solid rgba(15, 23, 42, 0.08);
        }

        h1 {
            margin: 0 0 10px;
            font-size: 2.4rem;
            letter-spacing: -.04em;
        }

        .subtitle {
            margin: 0 0 28px;
            color: #475569;
            line-height: 1.8;
        }

        label {
            display: block;
            margin-top: 20px;
            font-weight: 600;
            color: #334155;
        }

        input {
            width: 95%;
            padding: 14px 16px;
            margin-top: 8px;
            border: 1px solid rgba(15, 23, 42, 0.14);
            border-radius: 14px;
            background: #f8fafc;
            font-size: 1rem;
            color: #0f172a;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
        }

        button {
            width: 100%;
            margin-top: 28px;
            padding: 14px 18px;
            border: none;
            border-radius: 999px;
            background: linear-gradient(135deg, #2563eb, #0ea5e9);
            color: white;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 20px 34px rgba(37, 99, 235, 0.22);
        }

        .message {
            margin-top: 20px;
            color: #dc2626;
            font-weight: 600;
        }

        .info {
            margin-top: 18px;
            color: #475569;
            font-size: 0.95rem;
        }

        .info a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="login-box">
        <h1>Welcome back</h1>
        <p class="subtitle">Sign in to manage your people directory with a smooth, secure dashboard experience.</p>
        <form th:action="@{/login}" method="post">
            <label for="username">Username</label>
            <input id="username" type="text" name="username" required />

            <label for="password">Password</label>
            <input id="password" type="password" name="password" required />

            <button type="submit">Sign in</button>
        </form>
        <div class="message" th:if="${param.error}">Invalid username or password.</div>
        <div class="message" th:if="${param.logout}">You have been logged out.</div>
        <div class="info">Use <strong>admin / password</strong> to sign in.</div>
        <div class="info">New here? <a th:href="@{/register}">Create an account</a>.</div>
    </div>
</body>

</html>
