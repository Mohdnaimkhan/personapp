<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <title>Person App Dashboard</title>
    <style>
        body {
            margin: 0;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: linear-gradient(180deg, #e9f2ff 0%, #f8fbff 100%);
            color: #0f172a;
        }

        main {
            padding: 28px clamp(24px, 4vw, 48px);
        }

        h1 {
            margin: 0;
            font-size: clamp(2rem, 3vw, 2.6rem);
            letter-spacing: -0.03em;
            color: #0f172a;
        }

        p {
            margin: 12px 0 0;
            color: #475569;
            line-height: 1.7;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 18px;
            margin-top: 28px;
        }

        .page-header .eyebrow {
            text-transform: uppercase;
            letter-spacing: .22em;
            font-size: .8rem;
            color: #2563eb;
            margin-bottom: 8px;
        }

        .action-link {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 18px;
            border-radius: 15px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            font-weight: 700;
            box-shadow: 0 18px 38px rgba(37, 99, 235, 0.18);
        }

        .metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 22px;
            margin-top: 28px;
        }

        .card {
            padding: 26px;
            border-radius: 28px;
            background: white;
            border: 1px solid rgba(15, 23, 42, 0.08);
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.06);
        }

        .card h2 {
            margin: 0 0 14px;
            font-size: 1.05rem;
            color: #0f172a;
        }

        .card p {
            margin: 0;
            font-size: 2rem;
            font-weight: 700;
            color: #1d4ed8;
        }

        .section {
            margin-top: 36px;
        }

        .table-card {
            overflow: hidden;
            border-radius: 28px;
            border: 1px solid rgba(15, 23, 42, 0.08);
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.05);
            background: white;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 18px;
            border-bottom: 1px solid rgba(15, 23, 42, 0.08);
        }

        th {
            text-align: left;
            background: #eff6ff;
            color: #0f172a;
            font-weight: 700;
            letter-spacing: .01em;
        }

        tr:hover {
            background: #f8fbff;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tbody tr:nth-child(even) {
            background: #f8fbff;
        }

        .person-list {
            margin-top: 36px;
        }

        .person-list h2 {
            margin-bottom: 18px;
            font-size: 1.5rem;
            color: #0f172a;
        }

        .person-list p {
            margin-top: 0;
            color: #475569;
        }

        .table-card {
            overflow: hidden;
            border-radius: 10px;
            border: 1px solid rgba(15, 23, 42, 0.08);
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.05);
            background: rgb(218, 122, 122);
            margin-top: 18px;
        }

        a.button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 18px;
            border-radius: 20px;
            background: #0b63e5;
            color: white;
            text-decoration: none;
            font-weight: 700;
            transition: transform .18s ease;
        }

        a.button:hover {
            transform: translateY(-2px);
        }
    </style>
</head>

<body>
    <div th:replace="~{fragments/nav :: nav}"></div>
    <main class="page-shell">
        <div class="page-header">
            <div>
                <div class="eyebrow">Overview</div>
                <h1>Dashboard</h1>
                <p>Overview of the person directory.</p>
            </div>
            <a class="action-link" th:href="@{/persons}">View Persons</a>
        </div>

        <div class="metrics">
            <div class="card">
                <h2>Total persons</h2>
                <p th:text="${totalPersons}">0</p>
            </div>
            <div class="card">
                <h2>Average age</h2>
                <p th:text="${averageAge}">0</p>
            </div>
            <div class="card">
                <h2>Quick action</h2>
                <p><a class="button" th:href="@{/persons/new}">Add new person</a></p>
            </div>
        </div>

        <div class="person-list">
            <div class="section-header">
                <h2>Recent people</h2>
                <p>Quick glance at the latest entries in your directory.</p>
            </div>
            <div class="table-card">
                <table>
                    <thead>
                        <tr>
                            <th>First Name</th>
                            <th>Last Name</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="person : ${recentPersons}">
                            <td th:text="${person.firstName}"></td>
                            <td th:text="${person.lastName}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</body>

</html>
