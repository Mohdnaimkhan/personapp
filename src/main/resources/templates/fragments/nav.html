<div th:fragment="nav">
    <style>
        .top-nav {
            margin: 10px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
            padding: 18px clamp(24px, 4vw, 36px);
            background: white;
            backdrop-filter: blur(18px);
            box-shadow: 0 28px 50px rgba(15, 23, 42, 0.12);
            border-radius: 10px 10px 10px 10px;
            color: #0f172a;
        }

        .top-nav .logo {
            font-weight: 800;
            font-size: 1.38rem;
            letter-spacing: .04em;
            color: #1d4ed8;
        }

        .top-nav .nav-links {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }

        .nav-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            padding: 0 18px;
            border-radius: 12px;
            background: #ffffff;
            color: #0f172a;
            text-decoration: none;
            font-weight: 600;
            border: 1px solid rgba(15, 23, 42, 0.08);
            transition: transform .18s ease, background .18s ease, box-shadow .18s ease;
        }
         .nav-btn-logout {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            padding: 0 18px;
            border-radius: 12px;
            background: linear-gradient(135deg, #c1ef44, #32dc26);
            color: #0f172a;
            text-decoration: none;
            font-weight: 600;
            border: 1px solid rgba(15, 23, 42, 0.08);
            transition: transform .18s ease, background .18s ease, box-shadow .18s ease;
        }

        .nav-btn-logout:hover {
            transform: translateY(-2px);
            background: #6ee810;
            border: 1px solid rgba(15, 23, 42, 0.8);
            box-shadow: 0 16px 32px rgba(15, 23, 42, 0.1);
        }
        .nav-btn:hover {
            transform: translateY(-2px);
            background: #eff6ff;
            box-shadow: 0 16px 32px rgba(15, 23, 42, 0.1);
        }

        .nav-cta {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            padding: 0 20px;
            border-radius: 15px;
            background: linear-gradient(135deg, #2563eb, #0ea5e9);
            color: white;
            font-weight: 700;
            box-shadow: 2px 18px 42px rgba(14, 165, 233, 0.22);
        }

        .nav-cta:hover {
            transform: translateY(-2px);
        }

        .user-area  {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: .96rem;
            color: #334155;
        }

        .user-area a ,form button {
            color: #0f172a;
            text-decoration: none;
            text-align: center;
        }
     

        @media (max-width:860px) {
            .top-nav {
                flex-direction: column;
                align-items: flex-start;
                gap: 16px;
            }
        }
    </style>
    <nav class="top-nav" role="navigation">
        <div class="logo">Person App</div>
        <div class="nav-links">
            <a class="nav-btn" th:href="@{/dashboard}">Dashboard</a>
            <a class="nav-btn" th:href="@{/persons}">Persons</a>
            <a class="nav-btn" th:href="@{/about}">About Us</a>
            <a class="nav-cta" th:href="@{/persons/new}">+ Add Person</a>
            <div class="user-area" th:if="${username}">Hello, <strong th:text="${username}"></strong> •
                <form th:action="@{/logout}" method="post">
                    <button class="nav-btn-logout" type="submit">Logout</button>
                </form>
            </div>
        </div>
    </nav>
</div>
