<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title th:text="${person.id} == null ? 'Add Person' : 'Edit Person'">Person Form</title>
    <style>
        body { margin: 0; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:#eef4ff; color:#0f172a; }
        .page-shell { padding:28px clamp(24px,4vw,48px); }
        .form-panel { max-width:760px; margin:0 auto; padding:32px; border-radius:32px; background:white; border:1px solid rgba(15,23,42,0.08); box-shadow:0 24px 60px rgba(15,23,42,0.06); }
        h1 { margin:0 0 20px; font-size:clamp(2rem,2.4vw,2.4rem); color:#0f172a; }
        label { display:block; margin-top:20px; font-weight:600; color:#334155; }
        input { width:100%; padding:14px 16px; margin-top:10px; border:1px solid rgba(15,23,42,0.14); border-radius:14px; background:#f8fafc; font-size:1rem; color:#0f172a; }
        input:focus { outline:none; border-color:#2563eb; box-shadow:0 0 0 4px rgba(37,99,235,0.12); }
        .field-error { color:#dc2626; margin-top:8px; font-size:.95rem; }
        .form-actions { display:flex; flex-wrap:wrap; gap:14px; align-items:center; margin-top:28px; }
        .primary-btn { min-height:46px; padding:0 22px; border:none; border-radius:999px; background:#2563eb; color:white; font-weight:700; cursor:pointer; box-shadow:0 18px 34px rgba(37,99,235,0.18); }
        .secondary-link { color:#2563eb; text-decoration:none; font-weight:600; }
    </style>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<main class="page-shell">
    <div class="form-panel">
        <h1 th:text="${person.id} == null ? 'Add Person' : 'Edit Person'"></h1>
        <form th:action="@{/persons}" th:object="${person}" method="post">
    <input type="hidden" th:if="${person.id != null}" th:field="*{id}" />

    <label for="firstName">First Name</label>
    <input id="firstName" type="text" th:field="*{firstName}" />
    <div class="field-error" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>

    <label for="lastName">Last Name</label>
    <input id="lastName" type="text" th:field="*{lastName}" />
    <div class="field-error" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>

    <label for="email">Email</label>
    <input id="email" type="email" th:field="*{email}" />
    <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>

    <label for="age">Age</label>
    <input id="age" type="number" th:field="*{age}" min="0" max="150" />
    <div class="field-error" th:if="${#fields.hasErrors('age')}" th:errors="*{age}"></div>

    <div class="form-actions">
        <button class="primary-btn" type="submit">Save Person</button>
        <a class="secondary-link" th:href="@{/persons}">Back to list</a>
        <a class="secondary-link" th:href="@{/dashboard}">Dashboard</a>
    </div>
        </form>
    </div>
</main>
</body>
</html>
