<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Something went wrong</title>
    <style>
        body { margin: 0; min-height:100vh; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:#f4f8ff; color:#102a43; }
        .page-shell { padding:28px clamp(24px,4vw,48px); }
        .error-panel { max-width:800px; margin:0 auto; padding:34px; border-radius:32px; background:white; border:1px solid rgba(15,23,42,0.08); box-shadow:0 24px 60px rgba(15,23,42,0.06); }
        .error-panel h1 { margin:0 0 16px; font-size:clamp(2rem,2.6vw,2.6rem); color:#dc2626; }
        .error-panel p { margin:0 0 22px; color:#475569; line-height:1.8; }
        .details { background:#f1f5ff; border:1px solid rgba(59,130,246,0.2); padding:22px; border-radius:20px; margin-top:20px; }
        .details p { margin:0 0 12px; color:#1e293b; }
        .actions { margin-top:24px; display:flex; flex-wrap:wrap; gap:14px; }
        .btn-primary { display:inline-flex; align-items:center; justify-content:center; padding:12px 18px; border-radius:999px; background:#2563eb; color:white; text-decoration:none; font-weight:700; }
    </style>
</head>
<body>
<div th:replace="fragments/nav :: nav"></div>
<main class="page-shell">
    <div class="error-panel">
    <h1>Oops — an error occurred</h1>
    <p>The application could not complete your request.</p>
    <div class="details">
        <p><strong>Status:</strong> <span th:text="${statusCode}">Unknown</span></p>
        <p><strong>Message:</strong> <span th:text="${errorMessage}">Please try again later.</span></p>
    </div>
    <div class="actions">
        <a class="btn-primary" th:href="@{/dashboard}">Return to Dashboard</a>
        <a class="btn-primary" th:href="@{/persons}">View Persons</a>
    </div>
    </div>
</main>
</body>
</html>
